[package]
authors = ["Christopher Schröder <christopher.schroeder@tu-dortmund.de>", "Johannes Köster <johannes.koester@tu-dortmund.de>"]
description = "Experimental rust-htslib fork for evaluating SAM/BAM/CRAM support in Nanalogue."
edition = "2018"
include = ["src/**/*", "native/*.rs", "native/*.c", "native/*.h", "native/*.md", "native/*LICENSE", "native/*.sh", "native/bindings/*.rs", "vendor/**/*", "build.rs", "LICENSE.md", "README.md", "CHANGELOG.md"]
links = "hts"
keywords = ["htslib", "bam", "bioinformatics", "sequencing"]
license = "MIT"
name = "rust-htslib"
readme = "README.md"
repository = "https://github.com/sathish-t/nanalogue-seqlib.git"
version = "1.0.2"

[package.metadata.release]
pre-release-commit-message = "release version {{version}}"
tag-message = "Version {{version}} of Rust-HTSlib."

[dependencies]
bio-types = ">=0.9"
byteorder = "1.3"
custom_derive = "0.1"
libc = "0.2"
newtype_derive = "0.1"
thiserror = {version = "^2" }
url = "2.5"

[features]
# Compatibility aliases; bindings and native archives are always bundled.
bindgen = []
bzip2 = []
curl = []
default = ["bzip2", "lzma", "curl"]
gcs = ["curl"]
libdeflate = []
lzma = []
s3 = ["curl"]
static = []

[dev-dependencies]
tempfile = "3.1.0"
