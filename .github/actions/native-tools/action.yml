name: Vendored native build tools
description: Install the pinned Zig compiler and upstream build generators
inputs:
  install-cargo-zigbuild:
    description: Install cargo-zigbuild for Linux linker jobs
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INSTALL_CARGO_ZIGBUILD: ${{ inputs.install-cargo-zigbuild }}
      run: | # zizmor: ignore[github-env] -- This is a fixed, runner-owned directory.
        if [[ "$RUNNER_OS" == Linux ]]; then
          sudo apt-get update
          sudo apt-get install --yes cmake make perl
          bash native/install-minisign.sh
          export PATH="$HOME/.local/bin:$PATH"
        else
          command -v cmake >/dev/null || brew install cmake
          command -v minisign >/dev/null || brew install minisign
        fi
        bash native/install-zig.sh
        if [[ "$INSTALL_CARGO_ZIGBUILD" == true ]]; then
          cargo install --locked cargo-zigbuild --version 0.23.0
        fi
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
