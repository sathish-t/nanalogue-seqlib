name: Vendored native build tools
description: Install and verify the pinned Zig compiler
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [[ "$RUNNER_OS" == Linux ]]; then
          bash native/install-minisign.sh
          export PATH="$HOME/.local/bin:$PATH"
        else
          command -v minisign >/dev/null || brew install minisign
        fi
        bash native/install-zig.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
