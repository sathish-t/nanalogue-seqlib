name: Vendored native build tools
description: Install the pinned Zig compiler and upstream build generators
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        if [[ "$RUNNER_OS" == Linux ]]; then
          sudo apt-get update
          sudo apt-get install --yes cmake make perl
          bash native/install-minisign.sh
          export PATH="$HOME/.local/bin:$PATH"
        else
          command -v cmake >/dev/null || brew install cmake
          command -v minisign >/dev/null || brew install minisign
        fi
        bash native/install-zig.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
