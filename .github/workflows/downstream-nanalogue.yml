name: Downstream Nanalogue tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  Downstream-Nanalogue:
    name: Nanalogue (${{ matrix.platform }}, ${{ matrix.branch }}, ${{ matrix.feature }} features)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        branch: [main, mod-bam-viewer]
        feature: [default, all]
        platform:
          - linux-gnu-x86_64
          - linux-gnu-arm64
          - linux-musl-x86_64
          - linux-musl-arm64
          - macos-intel
          - macos-apple-silicon
          - windows-gnu-x86_64
        include:
          - platform: linux-gnu-x86_64
            os: ubuntu-22.04
            rust_target: ""
            artifact_name: nanalogue-linux-x86_64
          - platform: linux-gnu-arm64
            os: ubuntu-22.04-arm
            rust_target: ""
            artifact_name: nanalogue-linux-arm64
          - platform: linux-musl-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
            artifact_name: nanalogue-linux-x86_64-musl
          - platform: linux-musl-arm64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-musl
            artifact_name: nanalogue-linux-arm64-musl
          - platform: macos-intel
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            artifact_name: nanalogue-macos-x86_64
            macos_deployment_target: "10.14"
          - platform: macos-apple-silicon
            os: macos-15
            rust_target: aarch64-apple-darwin
            artifact_name: nanalogue-macos-arm64
            macos_deployment_target: "11.0"
          - platform: windows-gnu-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-pc-windows-gnu
            artifact_name: nanalogue-windows-x86_64

    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}

    steps:
      - name: Checkout nanalogue-seqlib
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check downstream branch
        id: downstream-branch
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          set +e
          remote_ref="$(git ls-remote --exit-code --heads \
            https://github.com/DNAReplicationLab/nanalogue.git \
            "refs/heads/$BRANCH")"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            commit="${remote_ref%%$'\t'*}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            echo "Using $BRANCH at $commit"
          elif [[ "$status" -eq 2 && "$BRANCH" == mod-bam-viewer ]]; then
            echo "Optional branch $BRANCH does not exist; skipping"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not resolve required downstream branch $BRANCH" >&2
            exit "$status"
          fi

      - name: Checkout Nanalogue
        if: steps.downstream-branch.outputs.exists == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: DNAReplicationLab/nanalogue
          # Pin the checkout to the branch head resolved immediately above.
          ref: ${{ steps.downstream-branch.outputs.commit }}
          path: downstream/nanalogue
          persist-credentials: false

      - name: Install stable toolchain
        if: steps.downstream-branch.outputs.exists == 'true'
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          if [[ -n "$RUST_TARGET" ]]; then
            rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          else
            rustup toolchain install stable --profile minimal
          fi
          rustup default stable

      - name: Install native build tools
        if: steps.downstream-branch.outputs.exists == 'true'
        uses: $/.github/actions/native-tools
        with:
          install-cargo-zigbuild: ${{ !startsWith(matrix.platform, 'macos-') }}

      - name: Use this nanalogue-seqlib checkout
        if: steps.downstream-branch.outputs.exists == 'true'
        working-directory: downstream/nanalogue
        run: |
          cargo add rust-htslib --path "$GITHUB_WORKSPACE" \
            --features libdeflate
          cargo tree -i rust-htslib | tee /tmp/rust-htslib-tree.txt
          grep -F "($GITHUB_WORKSPACE)" /tmp/rust-htslib-tree.txt

      - name: Compile every target
        if: steps.downstream-branch.outputs.exists == 'true'
        working-directory: downstream/nanalogue
        env:
          FEATURE_ARGS: ${{ matrix.feature == 'all' && '--all-features' || '' }}
          RUST_TARGET: ${{ matrix.rust_target }}
          USE_ZIGBUILD: ${{ !startsWith(matrix.platform, 'macos-') }}
        run: |
          feature_args=()
          if [[ -n "$FEATURE_ARGS" ]]; then
            feature_args+=("$FEATURE_ARGS")
          fi
          target_args=()
          if [[ -n "$RUST_TARGET" ]]; then
            target_args+=(--target "$RUST_TARGET")
          else
            target_args+=(--target "$(rustc -vV | sed -n 's/^host: //p')")
          fi
          if [[ "$USE_ZIGBUILD" == true ]]; then
            build_command=(cargo-zigbuild zigbuild)
          else
            build_command=(cargo build)
          fi
          build_targets=(--all-targets)
          if [[ "${{ matrix.platform }}" == windows-gnu-x86_64 ]]; then
            # Nanalogue has Unix-only integration-test crates; the product
            # binaries are the supported Windows deliverable.
            build_targets=(--bins)
          fi
          "${build_command[@]}" "${build_targets[@]}" "${target_args[@]}" "${feature_args[@]}"

      - name: Run downstream tests
        if: steps.downstream-branch.outputs.exists == 'true' && matrix.platform != 'windows-gnu-x86_64'
        working-directory: downstream/nanalogue
        env:
          FEATURE_ARGS: ${{ matrix.feature == 'all' && '--all-features' || '' }}
          RUST_TARGET: ${{ matrix.rust_target }}
          USE_ZIGBUILD: ${{ !startsWith(matrix.platform, 'macos-') }}
        run: |
          feature_args=()
          if [[ -n "$FEATURE_ARGS" ]]; then
            feature_args+=("$FEATURE_ARGS")
          fi
          target_args=()
          if [[ -n "$RUST_TARGET" ]]; then
            target_args+=(--target "$RUST_TARGET")
          else
            target_args+=(--target "$(rustc -vV | sed -n 's/^host: //p')")
          fi
          if [[ "$USE_ZIGBUILD" == true ]]; then
            test_command=(cargo-zigbuild test)
          else
            test_command=(cargo test)
          fi
          "${test_command[@]}" "${target_args[@]}" "${feature_args[@]}" -- --test-threads=1
          "${test_command[@]}" "${target_args[@]}" "${feature_args[@]}" -- \
            --ignored --test-threads=1

      - name: Build release artifact
        id: package
        if: steps.downstream-branch.outputs.exists == 'true' && matrix.branch == 'main' && matrix.feature == 'default'
        working-directory: downstream/nanalogue
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          PLATFORM: ${{ matrix.platform }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          if [[ -n "$RUST_TARGET" ]]; then
            target="$RUST_TARGET"
          else
            target="$(rustc -vV | sed -n 's/^host: //p')"
          fi
          if [[ "$PLATFORM" == macos-* ]]; then
            build_command=(cargo build)
          else
            build_command=(cargo-zigbuild zigbuild)
          fi
          "${build_command[@]}" --release --bin nanalogue --target "$target"

          package="$RUNNER_TEMP/$ARTIFACT_NAME"
          mkdir -p "$package"
          if [[ "$PLATFORM" == windows-gnu-x86_64 ]]; then
            cp "target/$target/release/nanalogue.exe" "$package/"
            file "$package/nanalogue.exe" | grep -F "PE32+ executable"
            python3 -m zipfile -c "$RUNNER_TEMP/$ARTIFACT_NAME.zip" \
              "$package/nanalogue.exe"
            echo "path=$RUNNER_TEMP/$ARTIFACT_NAME.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/$target/release/nanalogue" "$package/"
            tar -C "$package" -czf "$RUNNER_TEMP/$ARTIFACT_NAME.tar.gz" nanalogue
            echo "path=$RUNNER_TEMP/$ARTIFACT_NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release artifact
        if: steps.downstream-branch.outputs.exists == 'true' && matrix.branch == 'main' && matrix.feature == 'default'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  Windows-Smoke:
    name: Nanalogue Windows smoke tests
    needs: Downstream-Nanalogue
    runs-on: windows-2022
    steps:
      - name: Download Windows release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nanalogue-windows-x86_64

      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $fixture = "https://raw.githubusercontent.com/DNAReplicationLab/nanalogue/91827dbfe4a06e15c59c336aae3e2cb1f83db217/examples/example_1.bam"
          Expand-Archive .\nanalogue-windows-x86_64.zip .\nanalogue-windows-x86_64
          Invoke-WebRequest $fixture -OutFile .\example_1.bam
          .\nanalogue-windows-x86_64\nanalogue.exe --help
          .\nanalogue-windows-x86_64\nanalogue.exe read-stats .\example_1.bam
          .\nanalogue-windows-x86_64\nanalogue.exe read-stats $fixture
