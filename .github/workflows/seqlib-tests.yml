name: Seqlib tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  Coverage:
    name: Coverage (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Install system dependencies
        uses: $/.github/actions/native-tools
        with:
          install-cargo-zigbuild: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo-tarpaulin
        run: |
          set -x
          cargo install cargo-tarpaulin
          # Compile-fail tests invoke Cargo and rebuild the vendored native stack.
          cargo tarpaulin --timeout 300 --all-features --tests --doc --out Lcov \
            -- --test-threads 1

      - name: Upload coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info

  GNU:
    name: GNU tests (${{ matrix.os }}, ${{ matrix.feature }})
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        feature: [no-default, default, all]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install system dependencies
        uses: $/.github/actions/native-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        env:
          FEATURE_ARGS: ${{ matrix.feature == 'no-default' && '--no-default-features' || matrix.feature == 'all' && '--all-features' || '' }}
        run: |
          feature_args=()
          if [[ -n "$FEATURE_ARGS" ]]; then
            feature_args+=("$FEATURE_ARGS")
          fi
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          cargo-zigbuild test --target "$host_target" "${feature_args[@]}" -- --test-threads=1

  MUSL:
    name: MUSL tests (${{ matrix.rust_target }}, ${{ matrix.feature }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        feature: [no-default, default, all]
        include:
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install MUSL build dependencies
        uses: $/.github/actions/native-tools

      - name: Install stable MUSL toolchain
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          test "$(uname -m)" = "${RUST_TARGET%%-*}"
          rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl-${{ matrix.rust_target }}-${{ matrix.feature }}

      - name: Run MUSL tests
        env:
          # Compile-fail tests start nested Cargo invocations for this target.
          CARGO_BUILD_TARGET: ${{ matrix.rust_target }}
          FEATURE_ARGS: ${{ matrix.feature == 'no-default' && '--no-default-features' || matrix.feature == 'all' && '--all-features' || '' }}
        run: |
          feature_args=()
          if [[ -n "$FEATURE_ARGS" ]]; then
            feature_args+=("$FEATURE_ARGS")
          fi
          cargo-zigbuild test --target "$CARGO_BUILD_TARGET" "${feature_args[@]}" -- \
            --test-threads=1

  MacOS:
    name: macOS tests (${{ matrix.platform }}, ${{ matrix.feature }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        feature: [no-default, default, all]
        platform: [intel, apple-silicon]
        include:
          - platform: intel
            os: macos-15-intel
            toolchain_target: x86_64-apple-darwin
            deployment_target: "10.14"
          - platform: apple-silicon
            os: macos-15
            toolchain_target: aarch64-apple-darwin
            deployment_target: "11.0"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install stable toolchain
        env:
          RUST_TARGET: ${{ matrix.toolchain_target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          rustup default stable

      - name: Install htslib dependencies
        uses: $/.github/actions/native-tools
        with:
          install-cargo-zigbuild: false

      - name: Test
        env:
          RUST_TARGET: ${{ matrix.toolchain_target }}
          FEATURE_ARGS: ${{ matrix.feature == 'no-default' && '--no-default-features' || matrix.feature == 'all' && '--all-features' || '' }}
        run: |
          feature_args=()
          if [[ -n "$FEATURE_ARGS" ]]; then
            feature_args+=("$FEATURE_ARGS")
          fi
          cargo test --release --verbose --target "$RUST_TARGET" "${feature_args[@]}" -- \
            --test-threads=1

  Windows-GNU:
    name: Windows GNU compile (${{ matrix.feature }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        feature: [no-default, default, all]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install stable Windows GNU toolchain
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
          rustup default stable

      - name: Install native build tools
        uses: $/.github/actions/native-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-gnu-${{ matrix.feature }}

      - name: Compile Windows test targets
        env:
          FEATURE_ARGS: ${{ matrix.feature == 'no-default' && '--no-default-features' || matrix.feature == 'all' && '--all-features' || '' }}
        run: |
          feature_args=()
          if [[ -n "$FEATURE_ARGS" ]]; then
            feature_args+=("$FEATURE_ARGS")
          fi
          cargo-zigbuild test --release --target x86_64-pc-windows-gnu \
            "${feature_args[@]}" --no-run

  WASI:
    name: WASI compile and ABI checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install stable WASI toolchain
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustup default stable

      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1
        with:
          version: 49.0.2

      - name: Install native build tools
        uses: $/.github/actions/native-tools
        with:
          install-cargo-zigbuild: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: wasi

      - name: Compile WASI test targets
        run: cargo test --release --target wasm32-wasip1 --no-default-features --no-run

      - name: Run WASI ABI tests
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
        run: |
          cargo test --release --target wasm32-wasip1 --no-default-features \
            --test native_stack -- --test-threads=1

      - name: Reject unsupported default features
        run: |
          set +e
          output="$(cargo check --release --target wasm32-wasip1 2>&1)"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "WASI build unexpectedly accepted default features" >&2
            exit 1
          fi
          grep -F "WASI builds support local files and plain zlib only" <<<"$output"
