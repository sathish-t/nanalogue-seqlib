name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Formatting:
    name: Formatting
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check format
        run: cargo fmt -- --check

  Linting:
    name: Linting
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Lint with clippy
        run: RUSTFLAGS="-Dwarnings" cargo clippy --all-features --all-targets -- -Dclippy::all -Dunused_imports

  Testing:
    name: Coverage (${{ matrix.os }})
    needs: Formatting
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Install system dependencies
        run: |
          sudo apt-get install --yes zlib1g-dev libbz2-dev clang libc6-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo-tarpaulin
        run: |
          set -x
          cargo install cargo-tarpaulin
          cargo tarpaulin --all-features --tests --doc --out Lcov -- --test-threads 1

      - name: Upload coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info

  Testing-Features:
    name: Feature tests (${{ matrix.os }}, ${{ matrix.args }})
    needs: Formatting
    strategy:
      matrix:
        # Native GNU/Linux builds; MUSL is tested separately below.
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        args: [--no-default-features, --all-features]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install system dependencies
        run: |
          sudo apt-get install --yes zlib1g-dev libbz2-dev clang libc6-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        env:
          FEATURE_ARGS: ${{ matrix.args }}
        run: |
          cargo test "$FEATURE_ARGS"

  Testing-MUSL:
    name: MUSL tests (${{ matrix.rust_target }}, ${{ matrix.args }})
    needs: Formatting
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        args: [--no-default-features, --all-features]
        include:
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      # Also target MUSL in the compile-fail tests' nested Cargo invocations.
      CARGO_BUILD_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install MUSL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential musl-tools musl-dev \
            clang libclang-dev cmake perl pkg-config

      - name: Configure native MUSL toolchain
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          test "$(uname -m)" = "${RUST_TARGET%%-*}"
          rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          rustup default stable
          target_env="${RUST_TARGET//-/_}"
          # Compile C dependencies with MUSL headers and libraries. Rust supplies
          # its own MUSL CRT to the native GCC linker; do not use musl-gcc there.
          {
            printf 'CC_%s=musl-gcc\n' "$target_env"
            printf 'CARGO_TARGET_%s_LINKER=gcc\n' "${target_env^^}"
            printf 'BINDGEN_EXTRA_CLANG_ARGS_%s=--target=%s -I/usr/include/%s-linux-musl\n' \
              "$target_env" "$RUST_TARGET" "${RUST_TARGET%%-*}"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl-${{ matrix.rust_target }}-${{ matrix.args }}

      - name: Run MUSL tests
        env:
          FEATURE_ARGS: ${{ matrix.args }}
        run: cargo test --target "$CARGO_BUILD_TARGET" "$FEATURE_ARGS"

  Testing-MacOS:
    name: macOS tests (${{ matrix.toolchain_target }})
    needs: Formatting
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            toolchain_target: x86_64-apple-darwin
          - os: macos-15
            toolchain_target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install stable toolchain
        env:
          RUST_TARGET: ${{ matrix.toolchain_target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          rustup default stable

      - name: Install htslib dependencies
        run: brew install bzip2 zlib xz curl-openssl

      - name: Test
        env:
          RUST_TARGET: ${{ matrix.toolchain_target }}
        run: |
          cargo test --release --all-features --verbose --target "$RUST_TARGET"
