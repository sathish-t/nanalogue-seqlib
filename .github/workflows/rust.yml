name: CI

on:
  push:
    branches: [master, vendoring]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Formatting:
    name: Formatting
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Check format
        run: cargo fmt -- --check

  Linting:
    name: Linting
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: $/.github/actions/native-tools

      - name: Lint with clippy
        run: RUSTFLAGS="-Dwarnings" cargo clippy --all-features --all-targets -- -Dclippy::all -Dunused_imports

  Downstream-Nanalogue:
    name: Nanalogue (${{ matrix.branch }}, ${{ matrix.feature_name }})
    needs: Formatting
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            feature_name: default features
            feature_args: ""
          - branch: main
            feature_name: all features
            feature_args: --all-features
          - branch: mod-bam-viewer
            feature_name: default features
            feature_args: ""
          - branch: mod-bam-viewer
            feature_name: all features
            feature_args: --all-features

    steps:
      - name: Checkout nanalogue-seqlib
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check downstream branch
        id: downstream-branch
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          set +e
          remote_ref="$(git ls-remote --exit-code --heads \
            https://github.com/DNAReplicationLab/nanalogue.git \
            "refs/heads/$BRANCH")"
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            commit="${remote_ref%%$'\t'*}"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
            echo "Using $BRANCH at $commit"
          elif [[ "$status" -eq 2 && "$BRANCH" == mod-bam-viewer ]]; then
            echo "Optional branch $BRANCH does not exist; skipping"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not resolve required downstream branch $BRANCH" >&2
            exit "$status"
          fi

      - name: Checkout Nanalogue
        if: steps.downstream-branch.outputs.exists == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: DNAReplicationLab/nanalogue
          # Pin the checkout to the branch head resolved immediately above.
          ref: ${{ steps.downstream-branch.outputs.commit }}
          path: downstream/nanalogue
          persist-credentials: false

      - name: Install stable toolchain
        if: steps.downstream-branch.outputs.exists == 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install native build tools
        if: steps.downstream-branch.outputs.exists == 'true'
        uses: $/.github/actions/native-tools

      - name: Use this nanalogue-seqlib checkout
        if: steps.downstream-branch.outputs.exists == 'true'
        working-directory: downstream/nanalogue
        run: |
          cargo add rust-htslib --path "$GITHUB_WORKSPACE" \
            --features libdeflate
          cargo tree -i rust-htslib | tee /tmp/rust-htslib-tree.txt
          grep -F "($GITHUB_WORKSPACE)" /tmp/rust-htslib-tree.txt

      - name: Compile every target
        if: steps.downstream-branch.outputs.exists == 'true'
        working-directory: downstream/nanalogue
        env:
          FEATURE_ARGS: ${{ matrix.feature_args }}
        run: |
          feature_args=()
          if [[ -n "$FEATURE_ARGS" ]]; then
            feature_args+=("$FEATURE_ARGS")
          fi
          cargo build --all-targets "${feature_args[@]}"

      - name: Run downstream tests
        if: steps.downstream-branch.outputs.exists == 'true'
        working-directory: downstream/nanalogue
        env:
          FEATURE_ARGS: ${{ matrix.feature_args }}
        run: |
          feature_args=()
          if [[ -n "$FEATURE_ARGS" ]]; then
            feature_args+=("$FEATURE_ARGS")
          fi
          cargo test "${feature_args[@]}" -- --test-threads=1
          cargo test "${feature_args[@]}" -- \
            --ignored --test-threads=1

  Testing:
    name: Coverage (${{ matrix.os }})
    needs: Formatting
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install nightly toolchain
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Install system dependencies
        uses: $/.github/actions/native-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run cargo-tarpaulin
        run: |
          set -x
          cargo install cargo-tarpaulin
          # Compile-fail tests invoke Cargo and rebuild the vendored native stack.
          cargo tarpaulin --timeout 300 --all-features --tests --doc --out Lcov \
            --exclude-files 'native/bindings/*' -- --test-threads 1

      - name: Upload coverage
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./lcov.info

  Testing-Features:
    name: Feature tests (${{ matrix.os }}, ${{ matrix.args }})
    needs: Formatting
    strategy:
      matrix:
        # Native GNU/Linux builds; MUSL is tested separately below.
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        args: [--no-default-features, --all-features]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install system dependencies
        uses: $/.github/actions/native-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        env:
          FEATURE_ARGS: ${{ matrix.args }}
        run: |
          cargo test "$FEATURE_ARGS"

  Testing-MUSL:
    name: MUSL tests (${{ matrix.rust_target }}, ${{ matrix.args }})
    needs: Formatting
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        args: [--no-default-features, --all-features]
        include:
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      # Also target MUSL in the compile-fail tests' nested Cargo invocations.
      CARGO_BUILD_TARGET: ${{ matrix.rust_target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install MUSL build dependencies
        uses: $/.github/actions/native-tools

      - name: Configure native MUSL toolchain
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          test "$(uname -m)" = "${RUST_TARGET%%-*}"
          rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          rustup default stable
          target_env="${RUST_TARGET//-/_}"
          # build.rs compiles C with Zig's MUSL headers/libraries. Rust supplies
          # its own MUSL CRT to the native GCC linker.
          {
            printf 'CARGO_TARGET_%s_LINKER=gcc\n' "${target_env^^}"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl-${{ matrix.rust_target }}-${{ matrix.args }}

      - name: Run MUSL tests
        env:
          FEATURE_ARGS: ${{ matrix.args }}
        run: cargo test --target "$CARGO_BUILD_TARGET" "$FEATURE_ARGS"

  Testing-MacOS:
    name: macOS tests (${{ matrix.toolchain_target }})
    needs: Formatting
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            toolchain_target: x86_64-apple-darwin
          - os: macos-15
            toolchain_target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install stable toolchain
        env:
          RUST_TARGET: ${{ matrix.toolchain_target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$RUST_TARGET"
          rustup default stable

      - name: Install htslib dependencies
        uses: $/.github/actions/native-tools

      - name: Test
        env:
          RUST_TARGET: ${{ matrix.toolchain_target }}
        run: |
          cargo test --release --all-features --verbose --target "$RUST_TARGET"
